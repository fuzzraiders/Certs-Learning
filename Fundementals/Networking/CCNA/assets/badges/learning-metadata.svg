<svg width="1200" height="320" viewBox="0 0 940 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060616"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="940" height="200" rx="16" fill="url(#bg)"/>

  <!-- TITLE -->
  <text x="120" y="80"
        fill="url(#neon)"
        font-family="Fira Code, monospace"
        font-size="28"
        font-weight="800">
    Learning Note
  </text>

  <!-- SUB -->
  <text x="120" y="105"
        fill="#A5B4FC"
        font-family="Fira Code, monospace"
        font-size="12">
    Notes • Labs • Discipline • Mastery
  </text>

  <!-- LINE -->
  <line x1="120" y1="115" x2="900" y2="115"
        stroke="#1e293b" stroke-width="1"/>

  <!-- CARDS -->
  <g font-family="Fira Code, monospace" font-size="11">

    <rect x="120" y="130" width="220" height="40" rx="10" fill="#070b18" stroke="#00f5ff" opacity="0.6"/>
    <text x="135" y="150" fill="#00f5ff">Name</text>
    <text x="135" y="165" fill="#fff">Rufai10</text>

    <rect x="360" y="130" width="220" height="40" rx="10" fill="#070b18" stroke="#8b5cf6" opacity="0.6"/>
    <text x="375" y="150" fill="#8b5cf6">Role</text>
    <text x="375" y="165" fill="#fff">Evasion Spec</text>

    <rect x="600" y="130" width="260" height="40" rx="10" fill="#070b18" stroke="#16ff72" opacity="0.6"/>
    <text x="615" y="150" fill="#16ff72">Track</text>
    <text x="615" y="165" fill="#fff">CCNA 200-301</text>

  </g>

</svg>
