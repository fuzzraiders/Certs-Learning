<svg width="940" height="310" viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060C"/>
      <stop offset="100%" stop-color="#0A1230"/>
    </linearGradient>

    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FD4FF"/>
      <stop offset="100%" stop-color="#7A7CFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="310" rx="20" fill="url(#bg)"/>

  <!-- Card -->
  <rect x="20" y="20" width="900" height="270" rx="16"
        fill="#0A1026"
        stroke="#24356E"/>

  <!-- Title -->
  <text x="50" y="70"
        font-family="Inter, Arial"
        font-size="28"
        font-weight="800"
        fill="#FFFFFF">
    Learning Note
  </text>

  <!-- Accent line -->
  <line x1="50" y1="82" x2="240" y2="82"
        stroke="url(#acc)" stroke-width="2"/>

  <!-- ROWS -->
  <g font-family="Inter, Arial" font-size="16">

    <!-- Row -->
    <rect x="50" y="100" width="840" height="40" rx="10" fill="#111A3D"/>
    <rect x="50" y="100" width="5" height="40" rx="3" fill="url(#acc)"/>
    <text x="70" y="125" fill="#8DBDFF">Topic</text>
    <text x="220" y="125" fill="#E3EAFF">Networking</text>

    <!-- Row -->
    <rect x="50" y="150" width="840" height="40" rx="10" fill="#111A3D"/>
    <rect x="50" y="150" width="5" height="40" rx="3" fill="url(#acc)"/>
    <text x="70" y="175" fill="#8DBDFF">Focus</text>
    <text x="220" y="175" fill="#E3EAFF">CCNA 200-301</text>

    <!-- Row -->
    <rect x="50" y="200" width="840" height="40" rx="10" fill="#111A3D"/>
    <rect x="50" y="200" width="5" height="40" rx="3" fill="url(#acc)"/>
    <text x="70" y="225" fill="#8DBDFF">Level</text>
    <text x="220" y="225" fill="#E3EAFF">Foundations</text>

    <!-- Row -->
    <rect x="50" y="250" width="840" height="40" rx="10" fill="#111A3D"/>
    <rect x="50" y="250" width="5" height="40" rx="3" fill="url(#acc)"/>
    <text x="70" y="275" fill="#8DBDFF">Date</text>
    <text x="220" y="275" fill="#E3EAFF">08-04-2026</text>

  </g>

  <!-- Subtle animated dot -->
  <circle cx="880" cy="50" r="4" fill="#6FD4FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
