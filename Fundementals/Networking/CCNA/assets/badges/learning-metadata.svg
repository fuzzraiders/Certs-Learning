<svg width="940" height="200" viewBox="0 0 940 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060C"/>
      <stop offset="100%" stop-color="#0A1230"/>
    </linearGradient>

    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FD4FF"/>
      <stop offset="100%" stop-color="#7A7CFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="200" rx="18" fill="url(#bg)"/>

  <!-- Card -->
  <rect x="20" y="20" width="900" height="160" rx="14"
        fill="#0A1026"
        stroke="#24356E"/>

  <!-- Title -->
  <text x="50" y="65"
        font-family="Inter, Arial"
        font-size="22"
        font-weight="700"
        fill="#FFFFFF">
    Learning Note
  </text>

  <!-- Accent -->
  <line x1="50" y1="75" x2="200" y2="75"
        stroke="url(#acc)" stroke-width="2"/>

  <!-- Rows (compact) -->
  <g font-family="Inter, Arial" font-size="14">

    <!-- Row 1 -->
    <rect x="50" y="85" width="840" height="26" rx="6" fill="#111A3D"/>
    <rect x="50" y="85" width="4" height="26" rx="2" fill="url(#acc)"/>
    <text x="65" y="102" fill="#8DBDFF">Topic:</text>
    <text x="140" y="102" fill="#E3EAFF">Networking</text>

    <!-- Row 2 -->
    <rect x="50" y="115" width="840" height="26" rx="6" fill="#111A3D"/>
    <rect x="50" y="115" width="4" height="26" rx="2" fill="url(#acc)"/>
    <text x="65" y="132" fill="#8DBDFF">Focus:</text>
    <text x="140" y="132" fill="#E3EAFF">CCNA 200-301</text>

    <!-- Row 3 -->
    <rect x="50" y="145" width="840" height="26" rx="6" fill="#111A3D"/>
    <rect x="50" y="145" width="4" height="26" rx="2" fill="url(#acc)"/>
    <text x="65" y="162" fill="#8DBDFF">Level:</text>
    <text x="140" y="162" fill="#E3EAFF">Foundations</text>

  </g>

  <!-- Dot -->
  <circle cx="880" cy="50" r="3" fill="#6FD4FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
